name: Bump @tenphi/glaze

on:
  # Fired by the release workflow in tenphi/glaze.
  repository_dispatch:
    types: [glaze-release]
  # Safety net: a dispatch can be skipped (major migration pending), lost, or
  # raced by a manual commit, and the release that came with it would otherwise
  # never be picked up.
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with bump-tasty.yml so the two never race on push.
concurrency:
  group: bump-dependencies
  cancel-in-progress: false

jobs:
  bump:
    uses: ./.github/workflows/bump-dependency.yml
    with:
      package: '@tenphi/glaze'
      expected_version: ${{ github.event.client_payload.version || '' }}
