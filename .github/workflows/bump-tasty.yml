name: Bump @tenphi/tasty

on:
  # Fired by the release workflow in tenphi/tasty.
  repository_dispatch:
    types: [tasty-release]
  # Safety net: a dispatch can be skipped (major migration pending), lost, or
  # raced by a manual commit, and the release that came with it would otherwise
  # never be picked up.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with bump-glaze.yml so the two never race on push.
concurrency:
  group: bump-dependencies
  cancel-in-progress: false

jobs:
  bump:
    uses: ./.github/workflows/bump-dependency.yml
    with:
      package: '@tenphi/tasty'
